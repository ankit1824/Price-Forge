version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: priceforge-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile-Backend
    container_name: priceforge-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/priceforge?authSource=admin
      JWT_SECRET: your-secret-key-change-this
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: development
    volumes:
      - ./backend:/app

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile-ML
    container_name: priceforge-ml
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/priceforge?authSource=admin
      MODEL_NAME: all-MiniLM-L6-v2
    volumes:
      - ./ml-service:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile-Frontend
    container_name: priceforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ml-service

volumes:
  mongodb_data:

networks:
  default:
    name: priceforge-network