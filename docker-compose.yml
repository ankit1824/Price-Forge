version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: priceforge
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/priceforge?authSource=admin
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - NODE_ENV=development
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    command: npm run dev

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/priceforge?authSource=admin
      - BACKEND_URL=http://backend:5000
      - PYTHONUNBUFFERED=1
    depends_on:
      - mongodb
    volumes:
      - ./ml-service:/app

volumes:
  mongo_data:
